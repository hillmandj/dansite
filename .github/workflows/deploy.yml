name: Deploy

# Manual only for now: Actions tab -> Deploy -> Run workflow.
# To deploy automatically after CI passes on master, replace `on:` with:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       branches: [master]
#       types: [completed]
#
# and add `if: github.event.workflow_run.conclusion == 'success'` to the job.
on:
  workflow_dispatch:
  # TEMPORARY: deploy pre-cutover builds of the modernize branch to the new droplet
  # (served only at new.daniel-hillman.com). Remove this trigger when PR #15 is merged.
  push:
    branches: [modernize]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push the image to ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Trust the droplet's SSH host key
        run: |
          mkdir -p ~/.ssh
          echo "152.42.155.192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/ByZLN8Hg9lFYOTKdHH/yole+ME78kX1XrbLiftf0w" >> ~/.ssh/known_hosts

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy with Kamal
        run: bin/kamal deploy
