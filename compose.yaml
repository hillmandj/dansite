# Local development:
#   docker compose up            # http://localhost:3000
#   docker compose run --rm web bin/rails console
#   docker compose run --rm web bundle exec rspec
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: bash -c "bundle check || bundle install && bin/rails db:prepare && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    tty: true
    stdin_open: true

volumes:
  bundle:
